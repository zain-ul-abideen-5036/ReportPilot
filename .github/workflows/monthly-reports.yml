name: Monthly reports

# Search Console data lags 2–3 days, so the run is scheduled on the 2nd,
# 3rd and 4th at 06:00 UTC. The pipeline is idempotent: sites whose month
# is not final yet wait, and sites already done are skipped.
on:
  schedule:
    - cron: "0 6 2-4 * *"
  workflow_dispatch:
    inputs:
      period:
        description: "Reporting month (YYYY-MM). Defaults to last month."
        required: false
      site:
        description: "Run a single site id"
        required: false
      dry_run:
        description: "Generate everything but send nothing"
        type: boolean
        default: true

concurrency:
  group: monthly-reports
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      HEALTHCHECK_MONTHLY_URL: ${{ secrets.HEALTHCHECK_MONTHLY_URL }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the pipeline
        run: |
          ARGS=""
          [ -n "${{ inputs.period }}" ] && ARGS="$ARGS --period ${{ inputs.period }}"
          [ -n "${{ inputs.site }}" ] && ARGS="$ARGS --site ${{ inputs.site }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          # Without a database configured, fall back to the demo agency so the workflow is runnable on a fork.
          if [ -z "$DATABASE_URL" ]; then ARGS="$ARGS --demo"; fi
          npx tsx jobs/pipeline/src/cli.ts monthly $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 14
