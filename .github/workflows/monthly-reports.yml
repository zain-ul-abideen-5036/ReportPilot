name: Monthly reports

# Each client gets their report at 06:00 on their own report day (2nd–8th)
# in their own time zone. The workflow wakes hourly through that window and
# the plan step processes only the sites that are due, so Sydney goes out
# before London without a schedule per client. The pipeline is idempotent:
# sites already sent are skipped and sites whose month is not final wait.
on:
  schedule:
    - cron: "20 * 1-8 * *"
  workflow_dispatch:
    inputs:
      period:
        description: "Reporting month (YYYY-MM). Defaults to last month."
        required: false
      site:
        description: "Run a single site id"
        required: false
      dry_run:
        description: "Generate everything but send nothing"
        type: boolean
        default: true

concurrency:
  group: monthly-reports
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      HEALTHCHECK_MONTHLY_URL: ${{ secrets.HEALTHCHECK_MONTHLY_URL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      # The hourly schedule only does work where a database is configured;
      # on a fork it stops here in a few seconds instead of running the demo 190 times a month.
      - name: Check configuration
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -z "$DATABASE_URL" ]; then
            echo "No DATABASE_URL secret; scheduled run skipped. Use 'Run workflow' to try the demo."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.cfg.outputs.run == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.cfg.outputs.run == 'true'
      - name: Run the pipeline
        if: steps.cfg.outputs.run == 'true'
        run: |
          ARGS=""
          [ -n "${{ inputs.period }}" ] && ARGS="$ARGS --period ${{ inputs.period }}"
          [ -n "${{ inputs.site }}" ] && ARGS="$ARGS --site ${{ inputs.site }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          # Without a database configured, fall back to the demo agency so the workflow is runnable on a fork.
          if [ -z "$DATABASE_URL" ]; then ARGS="$ARGS --demo"; fi
          npx tsx jobs/pipeline/src/cli.ts monthly $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 14
