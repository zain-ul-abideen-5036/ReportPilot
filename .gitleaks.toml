# Secret scanning on every push. Extends the default rules and adds the
# shapes of keys this project uses.
[extend]
useDefault = true

[[rules]]
id = "google-service-account"
description = "Google service account private key in JSON"
regex = '''"private_key"\s*:\s*"-----BEGIN PRIVATE KEY-----'''

[[rules]]
id = "resend-api-key"
description = "Resend API key"
regex = '''re_[A-Za-z0-9]{8,}_[A-Za-z0-9]{16,}'''

[allowlist]
paths = ['''packages/integrations/test/''']
